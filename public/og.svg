<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Paper -->
  <rect width="1200" height="630" fill="#faf9f6" />
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#e8e3da" stroke-width="1" />

  <!-- Top micro-caps row -->
  <text class="mono" x="80" y="74" font-size="13" letter-spacing="3" fill="#746e65">A0 → A5 · 70 ARTICLES</text>
  <text class="mono" x="1120" y="74" font-size="13" letter-spacing="3" fill="#746e65" text-anchor="end">OFFLINE-FIRST ARCHIVE</text>
  <line x1="80" y1="104" x2="1120" y2="104" stroke="#e8e3da" stroke-width="1" />

  <!-- Title -->
  <text class="serif" x="80" y="272" font-size="112" font-weight="700" letter-spacing="-2" fill="#1a1714">Dumb</text>
  <text class="serif" x="80" y="386" font-size="112" font-weight="700" letter-spacing="-2" fill="#1a1714">Humanity</text>

  <!-- Description -->
  <text class="sans" x="80" y="452" font-size="21" fill="#565049">The complete knowledge required to rebuild</text>
  <text class="sans" x="80" y="482" font-size="21" fill="#565049">civilization from the ground up.</text>

  <!-- Bottom rule + colophon -->
  <line x1="80" y1="530" x2="1120" y2="530" stroke="#e8e3da" stroke-width="1" />
  <text class="mono" x="80" y="566" font-size="12.5" letter-spacing="2.6" fill="#746e65">FROM A CAMPFIRE TO A SPACE PROGRAM</text>
  <text class="mono" x="1120" y="566" font-size="12.5" letter-spacing="2.6" fill="#746e65" text-anchor="end">SEBASJGG27.GITHUB.IO/DUMB-HUMANITY</text>

  <!-- Dial motif -->
  <g transform="translate(950 316)">
    <circle r="158" fill="none" stroke="#e8e3da" stroke-width="1" />
    <circle r="146" fill="none" stroke="#e8e3da" stroke-width="1" stroke-dasharray="1 7" />

    <!-- ticks -->
    <g stroke="#746e65" stroke-width="1" opacity="0.7">
      <line x1="0" y1="-158" x2="0" y2="-138" transform="rotate(0)" />
      <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(30)" />
      <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(60)" />
      <line x1="0" y1="-158" x2="0" y2="-138" transform="rotate(90)" />
      <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(120)" />
      <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(150)" />
      <line x1="0" y1="-158" x2="0" y2="-138" transform="rotate(180)" />
      <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(210)" />
      <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(240)" />
      <line x1="0" y1="-158" x2="0" y2="-138" transform="rotate(270)" />
      <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(300)" />
      <line x1="0" y1="-158" x2="0" y2="-144" transform="rotate(330)" />
    </g>

    <!-- accent arcs -->
    <circle r="124" fill="none" stroke="#2b4a7a" stroke-width="1.6"
      stroke-dasharray="300 480" stroke-linecap="round" transform="rotate(-115)" />
    <circle r="108" fill="none" stroke="#2b4a7a" stroke-width="1" opacity="0.5"
      stroke-dasharray="140 536" stroke-linecap="round" transform="rotate(55)" />

    <!-- node hexagon -->
    <g stroke="#d6cfc3" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="-72" />
      <line x1="0" y1="0" x2="62" y2="-36" />
      <line x1="0" y1="0" x2="62" y2="36" />
      <line x1="0" y1="0" x2="0" y2="72" />
      <line x1="0" y1="0" x2="-62" y2="36" />
      <line x1="0" y1="0" x2="-62" y2="-36" />
      <path d="M0 -72 L62 -36 L62 36 L0 72 L-62 36 L-62 -36 Z" opacity="0.6" />
    </g>
    <g fill="#2b4a7a">
      <circle cx="0" cy="-72" r="3.5" />
      <circle cx="62" cy="-36" r="3.5" />
      <circle cx="62" cy="36" r="3.5" />
      <circle cx="0" cy="72" r="3.5" />
      <circle cx="-62" cy="36" r="3.5" />
      <circle cx="-62" cy="-36" r="3.5" />
    </g>

    <!-- central shield -->
    <g transform="scale(3.1) translate(-12 -12)" stroke-linejoin="round">
      <path d="M12 3 L5 6.5 V13 C5 17 8 20 12 21 C16 20 19 17 19 13 V6.5 Z"
        fill="#faf9f6" stroke="#1a1714" stroke-width="1.2" />
      <path d="M12 7.5 V14" stroke="#2b4a7a" stroke-width="1.4" stroke-linecap="round" />
      <circle cx="12" cy="14.5" r="1.4" fill="#2b4a7a" />
    </g>
  </g>
</svg>
